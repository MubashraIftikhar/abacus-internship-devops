<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background:#f4f6f8; }
  h1 { color: #2c3e50; }
  form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  input { display:block; width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
  button { background:#2980b9; color:#fff; border:none; padding:10px 18px; border-radius:4px; cursor:pointer; }
  button:hover { background:#1f6391; }
  table { width:100%; border-collapse: collapse; margin-top: 24px; background:#fff; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align:left; }
  th { background:#2c3e50; color:#fff; }
  #msg { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
  <h1>Student Registration</h1>
  <form id="regForm">
    <label>Name</label>
    <input type="text" id="name" required>
    <label>Roll No</label>
    <input type="text" id="roll_no" required>
    <button type="submit">Register</button>
  </form>
  <div id="msg"></div>

  <h2>Registered Students</h2>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Roll No</th></tr></thead>
    <tbody id="studentTable"></tbody>
  </table>

<script>
  const form = document.getElementById('regForm');
  const msg = document.getElementById('msg');
  const tableBody = document.getElementById('studentTable');

  async function loadStudents() {
    try {
      const res = await fetch('/api/students');
      const data = await res.json();
      tableBody.innerHTML = '';
      data.forEach(s => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${s.id}</td><td>${s.name}</td><td>${s.roll_no}</td>`;
        tableBody.appendChild(row);
      });
    } catch (e) {
      console.error('Failed to load students', e);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const roll_no = document.getElementById('roll_no').value;
    msg.textContent = '';
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, roll_no })
      });
      const data = await res.json();
      if (res.ok) {
        msg.style.color = 'green';
        msg.textContent = 'Registered successfully!';
        form.reset();
        loadStudents();
      } else {
        msg.style.color = 'red';
        msg.textContent = data.error || 'Registration failed';
      }
    } catch (err) {
      msg.style.color = 'red';
      msg.textContent = 'Could not reach backend: ' + err;
    }
  });

  loadStudents();
</script>
</body>
</html>
